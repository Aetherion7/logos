<title>Logos Reading Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: black on white; one narrow column; the author's cut-out portrait sits in the bottom-left corner and the text wraps around its outline */
:root{
  --paper:#ffffff; --ink:#000000; --soft:#6b6b6b; --hair:#e6e6e6; --mark:#ebebeb;
  --greek:"GFS Didot","Palatino Linotype",Georgia,serif;
  --body:"Newsreader",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --top:calc(90px + env(safe-area-inset-top,0px));
  --bw:min(36vw,200px);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}

.top{position:fixed;top:0;left:0;right:0;z-index:20;height:var(--top);box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));background:var(--paper)}
.brand{font-family:var(--greek);font-size:18px;letter-spacing:.04em;position:absolute;left:50%;transform:translateX(-50%)}
.top{justify-content:flex-end!important}
.top .lbl:hover{color:var(--ink)}

/* the sheet: every view scrolls inside it; two floats place the portrait in its bottom-left corner */
.sheet{position:fixed;top:var(--top);left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.flow{min-height:100%;height:100%}
.flow::after{content:"";display:block;clear:both}
.sp{float:left;width:1px;margin-left:-1px}
.bf{float:left;clear:left;width:var(--bw);height:auto;display:block;shape-image-threshold:.25;shape-margin:18px;margin-left:env(safe-area-inset-left,0px);
  opacity:0;transform:translateX(-14px);animation:bust 1.4s var(--ease) .1s forwards}
@keyframes bust{to{opacity:1;transform:none}}
.col{max-width:330px;margin:0 auto;padding:36px max(44px,env(safe-area-inset-right,0px)) 40px max(44px,env(safe-area-inset-left,0px))}
@media(min-width:900px){.col{padding-top:64px}}
.col.in{animation:in .7s var(--ease) both}
.col.fromR{animation:fromR .6s var(--ease) both}.col.fromL{animation:fromL .6s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.fade>*{animation:in .8s var(--ease) both}

h1{font-family:var(--greek);font-weight:400;font-size:25px;line-height:1.2;margin:0 0 4px;text-wrap:balance}
h2{font-family:var(--body);font-weight:300;font-style:italic;font-size:15px;margin:0 0 26px;color:var(--soft)}
p{margin:0 0 14px}
.btn{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding:4px 0;margin:0 22px 10px 0;transition:letter-spacing .3s var(--ease)}
.btn:hover{letter-spacing:.2em}
.btn.ghost{border-color:var(--hair);color:var(--soft)}
.row{margin-top:28px}
.steps{display:flex;gap:6px;margin:0 0 30px}.steps i{height:1px;flex:1;background:var(--hair);transition:background .4s}.steps i.on{background:var(--ink)}

/* home menu */
.menu{display:flex;flex-direction:column;margin:0 0 34px}
.menu>button,.menu>.confirm{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:15px 0;border-top:1px solid var(--hair);transition:padding .35s var(--ease)}
.menu>:last-child{border-bottom:1px solid var(--hair)}
.menu>button:hover{padding-left:8px}
.menu .k{font-size:15.5px}.menu .k i{font-style:italic;color:var(--soft);font-size:13.5px}
.confirm{flex-wrap:wrap}.confirm>span:first-child{font-size:14px}

/* alphabet */
.let{border-top:1px solid var(--hair);padding:16px 0;display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
.let .L{font-family:var(--greek);font-size:40px;line-height:1}.let .L span{color:var(--soft)}
.let .d{font-size:13.5px;color:var(--soft)}
.ex{font-family:var(--greek);font-size:16px}
.special{border-top:1px solid var(--hair);padding:14px 0}
.special .ex{font-size:22px;margin-right:10px}
.special p{font-size:13.5px;color:var(--soft);margin:6px 0 0}

/* library */
.lib button{display:block;width:100%;padding:18px 0;border-top:1px solid var(--hair);transition:padding .35s var(--ease)}
.lib button:last-child{border-bottom:1px solid var(--hair)}
.lib button:hover{padding-left:8px}
.lib .t{font-weight:300;font-size:20px;display:block;line-height:1.25}
.lib .a{font-size:13.5px;color:var(--soft);font-style:italic}

/* reader: words are inline-blocks, so every line follows the portrait's outline */
.head{margin-bottom:34px}
.head .et{font-weight:300;font-size:25px;line-height:1.15;margin:4px 0 2px;text-wrap:balance}
.head .t{font-family:var(--greek);font-size:14.5px;color:var(--soft);margin-bottom:6px}
.sent{margin:0 0 26px;cursor:pointer;opacity:0;animation:in .9s var(--ease) forwards}
.gk{font-family:var(--greek);font-size:16.5px;line-height:1.8}
.w{display:inline-block;vertical-align:top;margin-right:.3em;border-radius:2px;transition:background .3s,margin .4s var(--ease)}
.w>span:first-child{display:block}
.w.mk{background:color-mix(in srgb,var(--c,#000) 15%,transparent);box-shadow:inset 0 -1.5px 0 var(--c,#000)}
.ring{position:fixed;inset:0;z-index:30}
.dot{position:absolute;width:46px;height:46px;padding:0;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .45s var(--ease),opacity .3s}
.dot::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.22)}
.dot.rm::before{background:#9a9a9a}
.dot.rm::after{content:"";position:absolute;left:16px;right:16px;top:22px;height:2px;background:#fff;border-radius:1px}
.dot.cur::before{box-shadow:0 0 0 2px var(--c),0 2px 10px rgba(0,0,0,.22)}
.ring.on .dot{transform:translate(-50%,-50%) scale(1);opacity:1}
.ring.on .dot:hover{transform:translate(-50%,-50%) scale(1.12)}
.cd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c,#000);margin-right:8px;vertical-align:middle}
.w>.tr,.w>.gl{display:none;line-height:1.25}
.sent.open .w>.tr,.sent.open .w>.gl{display:block;animation:gl .6s var(--ease) both}
@keyframes gl{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.tr{font-family:var(--mono);font-size:9.5px;color:var(--soft)}
.gl{font-family:var(--body);font-size:11.5px;font-style:italic;color:var(--soft)}
.sent.open .w{margin-right:.65em;margin-bottom:6px}
.notr .sent.open .w>.tr{display:none}
.en{font-size:13px;font-style:italic;font-weight:300;max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .6s,margin .6s;border-left:1px solid var(--ink);padding-left:12px}
.sent.open .en{max-height:14em;opacity:1;margin-top:8px}
.tools{max-height:0;overflow:hidden;opacity:0;transition:all .5s var(--ease)}
.sent.open .tools{max-height:3em;opacity:1;margin-top:8px}
.tools{display:flex;justify-content:space-between;align-items:center}
.x{font-family:var(--body);font-weight:300;font-size:20px;line-height:1;width:28px;height:28px;text-align:center;border-radius:50%;transition:transform .4s var(--ease),background .3s}
.x:hover{transform:rotate(90deg);background:var(--mark)}
.tools button{margin-right:16px}
.sent.smk .gk{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.pager{margin-top:34px;border-top:1px solid var(--hair);padding-top:14px}
.pager button{margin-right:20px}
.pager button:disabled{opacity:0;cursor:default}
.pager .on{color:var(--ink)}
.hint{font-size:12.5px;color:var(--soft);font-style:italic;margin-top:14px}

/* recall */
.q{font-family:var(--greek);font-size:26px;line-height:1.4;margin:8px 0 6px}
.opts{margin-top:22px}
.opts button{display:block;width:100%;padding:12px 0;border-top:1px solid var(--hair);font-size:14.5px;transition:padding .3s var(--ease),color .3s}
.opts button:last-child{border-bottom:1px solid var(--hair)}
.opts button:hover{padding-left:8px}
.opts button.ok{padding-left:8px;text-decoration:underline;text-underline-offset:4px}
.opts button.no{color:var(--soft);text-decoration:line-through}
.score{font-family:var(--greek);font-size:56px;line-height:1}

/* saved + settings */
.it{border-top:1px solid var(--hair);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center}
.it .g{font-family:var(--greek);font-size:17px}.it .e{font-size:13px;color:var(--soft);font-style:italic;grid-column:1}
.it>button:last-child{grid-row:1/3;grid-column:2}
.grp{margin:26px 0 6px}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:15px 0;border-top:1px solid var(--hair)}
.set:last-child{border-bottom:1px solid var(--hair)}
.sw{width:34px;height:18px;border:1px solid var(--ink);border-radius:10px;position:relative;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--ink);transition:transform .35s var(--ease),background .3s}
.set[aria-checked="true"] .sw{background:var(--ink)}.set[aria-checked="true"] .sw::after{transform:translateX(16px);background:var(--paper)}

/* alphabet table overlay */
.ov{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;opacity:0;pointer-events:none;transition:opacity .5s var(--ease);
  padding:calc(70px + env(safe-area-inset-top,0px)) max(44px,env(safe-area-inset-right,0px)) 60px max(44px,env(safe-area-inset-left,0px))}
.ov.on{opacity:1;pointer-events:auto}
.ov .in2{max-width:460px;margin:0 auto;transform:translateY(10px);transition:transform .6s var(--ease)}.ov.on .in2{transform:none}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:7px 10px 7px 0;border-bottom:1px solid var(--hair);text-align:left;vertical-align:baseline}
th{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
td.g{font-family:var(--greek);font-size:20px;white-space:nowrap}
td.t{font-family:var(--mono)}
.close{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:max(24px,env(safe-area-inset-right,0px));z-index:41}

/* logo, home, progress, tiles, word peek, copy */
.logo{display:block;overflow:visible}
.logo text{font-family:var(--greek);fill:var(--ink)}
.brand .logo{height:30px;width:auto}
.brand.hide{visibility:hidden}
.home{text-align:center}
.home .logo{width:132px;height:auto;margin:6px auto 44px}
.hm{display:flex;flex-direction:column;align-items:center;gap:4px}
.hm>button{font-size:16px;padding:9px 18px;text-align:center;transition:letter-spacing .4s var(--ease),opacity .3s}

.hm .confirm{display:flex;flex-direction:column;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.hm .confirm .btn{margin:0 10px}
.prog{position:fixed;left:0;right:0;top:var(--top);height:2px;background:var(--hair);z-index:21;opacity:0;transition:opacity .4s}
.prog.on{opacity:1}
.prog i{display:block;height:100%;width:0;background:var(--ink);transition:width .9s var(--ease)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:220px;padding:14px;border:1px solid var(--hair);overflow:hidden;text-align:left;transition:border-color .3s,transform .4s var(--ease);animation:in .8s var(--ease) both}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.tile>span{position:relative;z-index:1;min-width:0}
.tile .te{font-weight:300;font-size:17px;line-height:1.2;display:block}
.tile .tg{font-family:var(--greek);font-size:12.5px;color:var(--soft);display:block;margin-top:4px;max-width:70%}
.tile img{position:absolute;right:-6px;bottom:0;width:46%;pointer-events:none}
.tile .bar{display:block;height:2px;background:var(--hair);margin-top:8px;width:50%}
.tile .bar i{display:block;height:100%;background:var(--ink)}
.sent,.w{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.sent .w.peek>.tr,.sent .w.peek>.gl{display:block;animation:gl .5s var(--ease) both}
.sent .w.peek{margin-right:.65em}
.notr .w>.tr{display:none!important}
.dot.cp::before{background:var(--ink)}
.dot.cp svg{position:absolute;left:15px;top:15px;width:16px;height:16px;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;opacity:0;transition:all .4s var(--ease);z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* home hover: the others fade, a soft circle shows the Greek */
.hm{gap:14px}
.hm>button{position:relative;display:grid;place-items:center;transition:opacity .4s;animation-fill-mode:backwards!important}
.hm .hen{white-space:nowrap;transition:color .4s}
.hm .hgr{position:absolute;inset:-4px -40px;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:var(--greek);background:var(--paper);color:var(--ink);pointer-events:none;clip-path:circle(0px at 50% 50%);transition:clip-path .35s var(--ease)}
@media (hover:hover){
  .hm>button{transition:opacity .4s,letter-spacing .4s var(--ease)}
  .hm:hover .hen{color:#c9c9c9}
}
/* pager: hands and bookmark */
.pager{display:flex;justify-content:space-between;align-items:center}
.pager button{margin:0;padding:6px;line-height:0}
.hand{width:58px;height:auto;display:block;transition:transform .45s var(--ease)}
#prev .hand{transform:scaleX(-1)}
#next:hover .hand{transform:translateX(5px)}
#prev:not(:disabled):hover .hand{transform:scaleX(-1) translateX(5px)}
#bm{color:var(--soft);transition:color .3s,transform .4s var(--ease)}
#bm.on{color:var(--ink)}
#bm:active{transform:scale(.88)}
/* Sisyphus on the progress bar */
.prog{overflow:visible}
.sis{position:absolute;bottom:1px;left:0;width:66px;height:41px;transition:left .9s var(--ease);pointer-events:none}
.sis img{position:absolute;inset:0;width:100%;height:100%}
.sis .st{transform-origin:68.98% 49.78%;transition:transform .9s var(--ease)}
.sis.push .mn{animation:push .9s var(--ease)}
@keyframes push{30%{transform:translateX(2px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

  <button class="lbl" id="nAbc">αβγ Table</button>

/* ---------- pronunciation (modern Greek reading, stress marked with an acute) ---------- */
function pron(word){
  const ch=[];
  for(const c of word.normalize("NFD")){
    if(/[̀-ͯ]/.test(c)){const L=ch[ch.length-1];if(L){if("́̀͂".includes(c))L.acc=1;if(c==="̈")L.dia=1}continue}
    const l=c.toLowerCase();if(/[α-ω]/.test(l))ch.push({c:l});
  }
  const VL="θκξπστφχψς",ACC={a:"á",e:"é",i:"í",o:"ó",u:"ú"};
  const st=(v,acc)=>acc?v.slice(0,-1)+ACC[v.slice(-1)]:v;
  const front=k=>{const x=ch[k]?.c,y=ch[k+1]?.c;return "εηιυ".includes(x||"-")||((x==="α"||x==="ο")&&y==="ι"&&!ch[k+1].dia)};
  let out="",i=0;
  while(i<ch.length){
    const a=ch[i],b=ch[i+1],A=a.c,B=b?.c;
    if(b&&!b.dia){
      const pair=A+B;
      const di={αι:"e",ει:"i",οι:"i",υι:"i",ου:"u"}[pair];
      if(di){out+=st(di,a.acc||b.acc);i+=2;continue}
      const vd={αυ:"a",ευ:"e",ηυ:"i"}[pair];
      if(vd){const nx=ch[i+2]?.c;out+=st(vd,a.acc||b.acc)+(!nx||VL.includes(nx)?"f":"v");i+=2;continue}
      if(A==="γ"&&"γκχξ".includes(B)){out+={γ:"ng",κ:i?"ng":"g",χ:"nch",ξ:"nx"}[B];i+=2;continue}
      if(A==="μ"&&B==="π"){out+=i?"mb":"b";i+=2;continue}
      if(A==="ν"&&B==="τ"){out+=i?"nd":"d";i+=2;continue}
      if(A==="τ"&&B==="ζ"){out+="dz";i+=2;continue}
      if(A===B&&"λμνπτκρσ".includes(A)){i++;continue}
    }
    const v={α:"a",ε:"e",η:"i",ι:"i",ο:"o",υ:"i",ω:"o"}[A];
    if(v){out+=st(v,a.acc);i++;continue}
    out+={β:"v",γ:front(i+1)?"y":"gh",δ:"dh",ζ:"z",θ:"th",κ:"k",λ:"l",μ:"m",ν:"n",ξ:"ks",π:"p",ρ:"r",
          σ:"βγδμ".includes(B||"-")?"z":"s",ς:"s",τ:"t",φ:"f",χ:"ch",ψ:"ps"}[A]||"";
    i++;
  }
  if((out.match(/[aeiouáéíóú]/g)||[]).length<2)out=out.normalize("NFD").replace(/́/g,"").normalize("NFC");
  return out;
}

const store={get(k,d){try{return JSON.parse(localStorage.getItem("logos2:"+k))??d}catch{return d}},set(k,v){try{localStorage.setItem("logos2:"+k,JSON.stringify(v))}catch{}},
  clear(){try{Object.keys(localStorage).filter(k=>k.startsWith("logos2:")).forEach(k=>localStorage.removeItem(k))}catch{}}};
let marks,progress,settings,last,nav=null;
function load(){marks=store.get("marks",[]).filter(m=>m.type!=="p");progress=store.get("progress",{});last=store.get("last",null);
  const pageOk=(id,p)=>{const t=TEXTS.find(x=>x.id===id);return t&&t.pages[p]};
  marks=marks.filter(m=>{const pg=pageOk(m.t,m.p);if(!pg)return false;if(m.type==="p")return true;const s=pg.s[m.s];return s&&(m.type==="s"||m.i<s.w.length)});
  if(last&&!pageOk(last.t,last.p))last=null;
  settings=Object.assign({portrait:true,translit:true,recall:true},store.get("settings",{}))}
load();
const save=()=>{store.set("marks",marks);store.set("progress",progress);store.set("settings",settings);store.set("last",last)};
const sheet=document.getElementById("sheet");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const words=s=>s.g.split(" ");
const key=m=>[m.type,m.t,m.p,m.s,m.i].join(":");
const isMarked=m=>marks.some(x=>key(x)===key(m));
function toggleMark(m){if(isMarked(m))marks=marks.filter(x=>key(x)!==key(m));else marks.push(m);save()}
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const $=s=>sheet.querySelector(s),$$=s=>sheet.querySelectorAll(s);

/* Every view renders into the sheet. With a text, the portrait floats in the bottom-left corner
   and shape-outside makes the lines of the column follow its transparent outline. */
function render(html,{text=null,anim="in",isHome=false}={}){
  nav=null;closeRing();let fl="";
  document.getElementById("prog").classList.remove("on");document.getElementById("home").classList.toggle("hide",isHome);
  if(text&&settings.portrait){const im=IMG[text.img];
    fl=`<div class="sp" style="height:calc(100% - var(--bw) * ${im.r})"></div><img class="bf" src="${im.src}" alt="Portrait of ${esc(text.name)}" style="shape-outside:url(${im.src});aspect-ratio:1/${im.r}">`}
  sheet.innerHTML=`<div class="flow">${fl}<div class="col ${anim}">${html}</div></div>`;
  sheet.scrollTop=0;sheet.classList.toggle("notr",!settings.translit);
}

/* ---------- home ---------- */

  const t=last&&TEXTS.find(x=>x.id===last.t);
  render(`<div class="home">${LOGO}<div class="hm fade">
    <button id="mNew"><span class="hgr" aria-hidden="true">Ἐξ ἀρχῆς</span><span class="hen">Start over</span></button>

    <button id="mAbc"><span class="hgr" aria-hidden="true">Τὰ γράμματα</span><span class="hen">The alphabet</span></button>
    <button id="mLib"><span class="hgr" aria-hidden="true">Τὰ βιβλία</span><span class="hen">Texts</span></button>
    <button id="mSaved"><span class="hgr" aria-hidden="true">Μνήμη</span><span class="hen">Saved</span></button>
    <button id="mTbl"><span class="hgr" aria-hidden="true">Ὁ πίναξ</span><span class="hen">Alphabet table</span></button>
    <button id="mSet"><span class="hgr" aria-hidden="true">Διάταξις</span><span class="hen">Settings</span></button>
  </div></div>`,{isHome:true});
  $("#mNew").onclick=()=>{const c=document.createElement("div");c.className="confirm";
    c.innerHTML=`<span>Erase all progress and marks?</span><span><button class="btn" id="cY">Start over</button><button class="btn ghost" id="cN">Cancel</button></span>`;
    $("#mNew").replaceWith(c);c.querySelector("#cN").onclick=home;
    c.querySelector("#cY").onclick=()=>{const s=settings;store.clear();load();settings=s;save();lesson(0)}};
  if(t)$("#mCont").onclick=()=>read(t,last.p);
  $("#mAbc").onclick=()=>lesson(store.get("abcDone",false)?0:store.get("lesson",0));
  $$(".hm>button").forEach(b=>{const g=b.querySelector(".hgr");let x=0,y=0;
    const at=r=>{g.style.clipPath=`circle(${r}px at ${x}px ${y}px)`};
    b.addEventListener("pointermove",e=>{if(e.pointerType!=="mouse")return;const q=g.getBoundingClientRect();x=e.clientX-q.left;y=e.clientY-q.top;at(15)});
    b.addEventListener("pointerleave",()=>at(0))});
  $("#mLib").onclick=library;$("#mSaved").onclick=saved;$("#mTbl").onclick=openOv;$("#mSet").onclick=settingsView;
}

/* ---------- chapter I: alphabet ---------- */
function lessonSteps(){const st=[{k:"intro"}];for(let i=0;i<ABC.length;i+=4)st.push({k:"letters",from:i});st.push({k:"special"},{k:"quiz"});return st}
function lesson(n=0,dir="in"){
  const st=lessonSteps();n=Math.max(0,Math.min(n,st.length-1));store.set("lesson",n);
  const bar="";
  const s=st[n];let h="";
  if(s.k==="intro")h=`<p class="lbl">Chapter I · The Alphabet</p><h1>The Beginning</h1><h2>Before we read: twenty-four letters.</h2>
   <p>The Greek alphabet has 24 letters. You know many of them from mathematics. In six short steps you learn each letter with its Latin transliteration and sound, then the special signs: breathings, accents, diphthongs.</p>
   <p>The full table is always one tap away: <span class="lbl">αβγ Table</span>, top right.</p>`;
  if(s.k==="letters"){const L=ABC.slice(s.from,s.from+4);
   h=`<p class="lbl">Letters ${s.from+1}–${s.from+L.length} of 24</p><div class="fade">`+L.map((l,i)=>`<div class="let" style="animation-delay:${i*.12}s"><div class="L">${l[0]} <span>${l[1]}</span></div>
     <div><div>${l[2]} · <span class="lbl" style="color:var(--ink)">${l[3]}</span></div><div class="d">${l[4]}</div><div class="ex">${l[5]}</div></div></div>`).join("")+`</div>`}
  if(s.k==="special")h=`<p class="lbl">Special signs</p><h1>Signs above the letters</h1><h2>What else appears in the texts.</h2><div class="fade">`+
   SPECIAL.map((x,i)=>`<div class="special" style="animation-delay:${i*.1}s"><span class="ex">${x[0]}</span>${x[1]}<p>${x[2]}</p></div>`).join("")+`</div>`;
  if(s.k==="quiz"){render(bar+`<div id="qz"></div>`,{anim:dir});setProg(n,st.length);return alphaQuiz()}
  render(bar+h+`<div class="pager"><button id="prev" aria-label="Back" data-go="${n-1}" ${n>0?"":"disabled"}><img class="hand" src="${HAND}" alt=""></button><button id="next" aria-label="Next" data-go="${n+1}"><img class="hand" src="${HAND}" alt=""></button></div>`,{anim:dir});setProg(n,st.length);
  $$("[data-go]").forEach(b=>b.onclick=()=>lesson(+b.dataset.go,+b.dataset.go>n?"fromR":"fromL"));
  nav={go:d=>{if(d>0)lesson(n+1,"fromR");else if(n>0)lesson(n-1,"fromL")}};
}
function alphaQuiz(){
  const pool=shuffle(ABC).slice(0,8);let i=0,ok=0;const box=$("#qz");
  const step=()=>{
    if(i===pool.length){store.set("abcDone",true);box.innerHTML=`<div class="fade"><p class="lbl">Result</p><div class="score">${ok}/${pool.length}</div><p style="margin-top:18px">${ok<6?"Almost there. The table stays one tap away.":"You know the alphabet."} Now on to the texts.</p><div class="row"><button class="btn" id="go">To the texts →</button><button class="btn ghost" id="re">Again</button></div></div>`;
      box.querySelector("#go").onclick=library;box.querySelector("#re").onclick=alphaQuiz;return}
    const l=pool[i],opts=shuffle([l,...shuffle(ABC.filter(x=>x!==l)).slice(0,3)]);
    box.innerHTML=`<p class="lbl">Quick test · ${i+1}/${pool.length} · Which sound?</p><div class="q" style="font-size:60px">${l[1].split(" ")[0]}</div><div class="opts fade">${opts.map((o,j)=>`<button style="animation-delay:${j*.07}s" data-v="${o[3]}">${o[3]} <span style="color:var(--soft)">· ${o[2]}</span></button>`).join("")}</div>`;
    box.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{const r=b.dataset.v===l[3];if(r)ok++;else b.classList.add("no");box.querySelectorAll(".opts button").forEach(x=>{if(x.dataset.v===l[3])x.classList.add("ok");x.disabled=true});i++;setTimeout(step,r?650:1300)})};
  nav=null;step()}

/* ---------- chapter II: library ---------- */
function library(){
  render(`<p class="lbl">Chapter II · Reading</p><h1>Library</h1><h2>Complete works, read sentence by sentence.</h2>
  <div class="tiles">${TEXTS.map((t,i)=>{const p=progress[t.id],n=t.pages.length,f=p!=null?(Math.min(p+1,n))/n:0;
    return `<button class="tile" style="animation-delay:${i*.1}s" data-t="${t.id}"><span><span class="te">${t.en}</span><span class="tg">${t.title}</span></span>
      <span><span class="lbl">${t.name}</span><span class="lbl" style="display:block">${p!=null?`p. ${Math.min(p+1,n)} / ${n}`:`${n} pages`}</span><span class="bar"><i style="width:${(f*100).toFixed(1)}%"></i></span></span>
      ${settings.portrait?`<img src="${IMG[t.img].src}" alt="">`:""}</button>`}).join("")}</div>`);
  $$("[data-t]").forEach(b=>b.onclick=()=>{const t=TEXTS.find(x=>x.id===b.dataset.t);read(t,Math.min(progress[t.id]||0,t.pages.length-1))})}

/* ---------- reader ---------- */
function read(t,p,anim="in"){
  const page=t.pages[p];progress[t.id]=p;last={t:t.id,p};save();
  render(`<div class="head"><p class="lbl" style="margin:0">${t.name}</p><div class="et">${t.en}</div><div class="t">${t.title}</div><span class="lbl">${page.ref} · page ${p+1} of ${t.pages.length}</span></div>
   ${page.s.map((s,si)=>`<div class="sent${isMarked({type:"s",t:t.id,p,s:si,i:-1})?" smk":""}" style="animation-delay:${.2+si*.22}s" data-s="${si}" tabindex="0">
     <div class="gk">${words(s).map((w,wi)=>`<span class="w${wcls({type:"w",t:t.id,p,s:si,i:wi})}" data-w="${wi}"><span>${w}</span><span class="tr">${pron(w)}</span><span class="gl">${esc(s.w[wi]||"–")}</span></span>`).join("")}</div>
     <div class="en">${esc(s.e)}</div>
     <div class="tools"><button class="lbl" data-ms>${isMarked({type:"s",t:t.id,p,s:si,i:-1})?"✓ Sentence saved":"+ Save sentence"}</button><span><button class="lbl" data-cp style="margin-right:14px">Copy</button><button class="x" data-x aria-label="Close sentence">×</button></span></div></div>`).join("")}
   <div class="pager"><button id="prev" aria-label="Previous page" ${p?"":"disabled"}><img class="hand" src="${HAND}" alt=""></button><button id="next" aria-label="${p<t.pages.length-1?"Next page":"Finish"}"><img class="hand" src="${HAND}" alt=""></button></div>
   <p class="hint">Tap a word for its meaning. Double-tap a sentence for the full translation. Hold a word to mark or copy it. Swipe to turn pages.</p>`,{text:t,anim});
  setProg(p,t.pages.length);
  $$(".sent").forEach(el=>{const si=+el.dataset.s,s=page.s[si];
    let lp=null,longed=false,sx=0,sy=0,tap=null;
    const cancel=()=>{clearTimeout(lp);lp=null};
    el.addEventListener("pointerdown",e=>{const w=e.target.closest(".w");longed=false;sx=e.clientX;sy=e.clientY;cancel();
      if(w)lp=setTimeout(()=>{longed=true;const i=+w.dataset.w;try{navigator.vibrate&&navigator.vibrate(8)}catch{}
        ring(w,{type:"w",t:t.id,p,s:si,i},words(s)[i]+" – "+s.w[i])},480)});
    el.addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)cancel()});
    ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,cancel));
    el.addEventListener("contextmenu",e=>e.preventDefault());
    el.addEventListener("click",e=>{
      if(longed){longed=false;return}
      const ms=e.target.closest("[data-ms]");
      if(ms){const m={type:"s",t:t.id,p,s:si,i:-1};toggleMark(m);el.classList.toggle("smk",isMarked(m));ms.textContent=isMarked(m)?"✓ Sentence saved":"+ Save sentence";return}
      if(e.target.closest("[data-x]")){el.classList.remove("open");closeRing();return}
      if(e.target.closest("[data-cp]")){copyText(s.g+"\n"+s.e);return}
      const w=e.target.closest(".w");
      if(tap){clearTimeout(tap);tap=null;$$(".w.peek").forEach(x=>x.classList.remove("peek"));el.classList.contains("open")?el.classList.remove("open"):openSent(el);return}
      tap=setTimeout(()=>{tap=null;if(!w||el.classList.contains("open"))return;const on=w.classList.contains("peek");$$(".w.peek").forEach(x=>x.classList.remove("peek"));if(!on)w.classList.add("peek")},260)});
    el.addEventListener("keydown",e=>{if(e.target===el&&(e.key==="Enter"||e.key===" ")){e.preventDefault();el.classList.contains("open")?el.classList.remove("open"):openSent(el)}})});
  const go=d=>{if(d<0){if(p>0)read(t,p-1,"fromL")}else settings.recall?recall(t,p):next(t,p)};
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
  nav={go};
}
function setProg(p,n){const pr=document.getElementById("prog"),f=n>1?p/(n-1):1;pr.classList.add("on");pr.firstElementChild.style.width=`calc(${f} * (100% - 66px) + 1px)`;
  const sis=document.getElementById("sis");sis.style.left=`calc(${f} * (100% - 66px))`;sis.querySelector(".st").style.transform=`rotate(${p*110}deg)`;sis.classList.remove("push");void sis.offsetWidth;sis.classList.add("push")}
function next(t,p){p<t.pages.length-1?read(t,p+1,"fromR"):library()}

function openSent(el){$$(".sent.open").forEach(x=>x.classList.remove("open"));closeRing();el.classList.add("open")}

/* colour marking: tapping a word in an open sentence draws a ring of colour dots around it */
const COLORS=["#e5484d","#ffc53d","#46a758","#0090ff"];
const markOf=m=>marks.find(x=>key(x)===key(m));
function wcls(m){const x=markOf(m);return x?` mk" style="--c:${x.c||"#000"}`:""}
function setMark(m,c){marks=marks.filter(x=>key(x)!==key(m));if(c)marks.push({...m,c});save()}
function toast(msg){let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el)}
  el.textContent=msg;el.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("on"),1400)}
function copyText(x){const fb=()=>{const a=document.createElement("textarea");a.value=x;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch{}a.remove();toast(ok?"Copied":"Copy not available here")};
  try{navigator.clipboard.writeText(x).then(()=>toast("Copied"),fb)}catch{fb()}}
const CPI='<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x="3" y="3" width="6" height="6"/><path d="M1 7V1h6"/></svg>';
let ringEl=null;
function closeRing(){if(!ringEl)return;const r=ringEl;ringEl=null;r.classList.remove("on");setTimeout(()=>r.remove(),350)}
function ring(wEl,m,text){
  closeRing();const cur=markOf(m),b=wEl.getBoundingClientRect();
  const cx=b.left+b.width/2,cy=b.top+b.height/2,R=Math.max(b.width/2+34,78),up=cy-R-30>60,W=innerWidth;
  const list=[...COLORS,"copy",...(cur?["none"]:[])],el=document.createElement("div");el.className="ring";
  el.innerHTML=list.map((c,k)=>{const a=Math.PI+(up?1:-1)*(k/(list.length-1))*Math.PI,cls=c==="none"?" rm":c==="copy"?" cp":"";
    const lab=c==="none"?"Remove mark":c==="copy"?"Copy":"Mark with colour "+(k+1);
    return `<button class="dot${cls}${cur&&cur.c===c?" cur":""}" data-c="${c}" aria-label="${lab}" style="left:${Math.min(W-28,Math.max(28,cx+R*Math.cos(a))).toFixed(1)}px;top:${(cy+R*Math.sin(a)).toFixed(1)}px;--c:${c};transition-delay:${k*35}ms">${c==="copy"?CPI:""}</button>`}).join("");
  document.body.appendChild(el);ringEl=el;requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("on")));
  el.addEventListener("click",e=>{const d=e.target.closest(".dot");
    if(d&&d.dataset.c==="copy")copyText(text);
    else if(d){setMark(m,d.dataset.c==="none"?null:d.dataset.c);const x=markOf(m);wEl.classList.toggle("mk",!!x);if(x)wEl.style.setProperty("--c",x.c);else wEl.style.removeProperty("--c")}
    closeRing()});
}
sheet.addEventListener("scroll",closeRing,{passive:true});

/* page turning: arrow keys and horizontal swipes */
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOv();if(!nav||ov.classList.contains("on"))return;
  if(e.key==="ArrowRight")nav.go(1);if(e.key==="ArrowLeft")nav.go(-1)});
let tx=null,ty=null;
sheet.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
sheet.addEventListener("touchend",e=>{if(tx==null||!nav)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)nav.go(dx<0?1:-1)},{passive:true});

/* ---------- recall after each page ---------- */
function itemFor(m){const t=TEXTS.find(x=>x.id===m.t),s=t.pages[m.p].s[m.s];
  return m.type==="w"?{q:words(s)[m.i].replace(/[,·;.]/g,""),a:s.w[m.i],ctx:s.g,kind:"Word"}:{q:s.g,a:s.e,kind:"Sentence"}}

/* words that carry little meaning on their own; a phrase needs at least one other word */
const STOP=new Set(["the","and","but","for","indeed","(would)","then","at least","both","or","also","even","on the one hand","on the other","on one hand","(and)","(ever)","of the","to the","in the","by the","the one","the ones","so","a","to","of","in","by","not","as","that","if","however","again","at any rate","surely","truly","perhaps","now","than","with","from","on","at","about","into","this","these","it","he","they"]);
const cleanG=x=>x.replace(/[,·;.:!?—…]+$/,"");
const cleanE=x=>x.filter(g=>!/^\(.*\)$/.test(g)).join(" ");

/* split a page into phrases of 1–3 words that never cross punctuation */
function phrasesOf(t,p){const out=[];
  t.pages[p].s.forEach((s,si)=>{const W=words(s);let i=0;
    while(i<W.length){const want=1+Math.floor(Math.random()*3),ks=[];
      for(let k=i;k<W.length&&ks.length<want;k++){ks.push(k);if(/[,·;.]$/.test(W[k]))break}
      if(ks.some(k=>!STOP.has(s.w[k]))){const e=cleanE(ks.map(k=>s.w[k]));
        if(e)out.push({si,ks,g:ks.map(k=>cleanG(W[k])).join(" "),e,n:ks.length})}
      i+=ks.length}});
  return out}
function poolAround(t,p){const ps=[];for(let k=Math.max(0,p-3);k<=Math.min(t.pages.length-1,p+3);k++)ps.push(...phrasesOf(t,k));return ps}

/* one question: q shown, a correct, opts four choices; greek tells which side is Greek */
function mkPhrase(ph,pool,toGreek){
  const key=toGreek?"g":"e",same=pool.filter(x=>x[key]!==ph[key]&&x.n===ph.n),any=pool.filter(x=>x[key]!==ph[key]);
  const ds=[...new Set(shuffle(same.length>=3?same:any).map(x=>x[key]))].slice(0,3);
  return {kind:ph.n>1?"Phrase":"Word",q:toGreek?ph.e:ph.g,a:toGreek?ph.g:ph.e,opts:shuffle([toGreek?ph.g:ph.e,...ds]),qGreek:!toGreek,dir:toGreek?"English → Greek":"Greek → English"}}
function mkSentence(s,t,toGreek){
  const all=[];t.pages.forEach(pg=>pg.s.forEach(x=>{if(x!==s)all.push(x)}));
  const L=s.w.length,near=all.filter(x=>x.w.length>=L*.6&&x.w.length<=L*1.6);const ds=shuffle(near.length>=3?near:all).slice(0,3).map(x=>toGreek?x.g:x.e);
  return {kind:"Sentence",q:toGreek?s.e:s.g,a:toGreek?s.g:s.e,opts:shuffle([toGreek?s.g:s.e,...ds]),qGreek:!toGreek,dir:toGreek?"English → Greek":"Greek → English"}}
function fromMark(m){const t=TEXTS.find(x=>x.id===m.t),s=t.pages[m.p].s[m.s],dir=Math.random()<.5;
  if(m.type==="s")return mkSentence(s,t,dir);
  const W=words(s);return mkPhrase({g:cleanG(W[m.i]),e:cleanE([s.w[m.i]])||s.w[m.i],n:1},poolAround(t,m.p),dir)}

function pageQuiz(t,p){
  const items=[],seen=new Set(),add=it=>{if(it&&!seen.has(it.q)&&it.opts.length>=2){seen.add(it.q);items.push(it)}};
  marks.filter(m=>m.t===t.id&&m.p===p&&m.type!=="p").forEach(m=>add(fromMark(m)));
  const pool=poolAround(t,p),own=shuffle(phrasesOf(t,p)),sents=shuffle(t.pages[p].s.slice());
  let k=0;while(items.length<7&&k<own.length){add(mkPhrase(own[k],pool,k%2===1));k++}
  sents.slice(0,Math.min(3,sents.length)).forEach((s,j)=>{if(items.length<10)add(mkSentence(s,t,j%2===1))});
  return shuffle(items)}

function quiz(items,text,title,onDone){
  let i=0,ok=0;const wrong=[];
  const step=()=>{
    if(i===items.length)return onDone(ok,wrong);
    const it=items[i],long=it.q.length>60;
    render(`<p class="lbl">${title} · ${i+1}/${items.length}</p><p class="lbl" style="margin:0 0 6px">${it.kind} · ${it.dir}</p>
      <div class="q" style="${it.qGreek?"":"font-family:var(--body);font-weight:300;"}${long?"font-size:19px":""}">${esc(it.q)}</div>
      ${it.qGreek&&settings.translit?`<button class="lbl" id="pr" style="text-transform:none;letter-spacing:.04em">Tap for pronunciation</button>`:""}
      <div class="opts fade">${it.opts.map((o,j)=>`<button style="animation-delay:${j*.07}s;${it.qGreek?"":"font-family:var(--greek);font-size:16px"}" data-j="${j}">${esc(o)}</button>`).join("")}</div>`,{text,anim:i?"fromR":"in"});
    const pr=$("#pr");if(pr)pr.onclick=()=>{pr.textContent=it.q.split(" ").map(pron).join(" ");pr.style.color="var(--ink)"};
    $$(".opts button").forEach(b=>b.onclick=()=>{const r=it.opts[+b.dataset.j]===it.a;if(r)ok++;else{wrong.push(it);b.classList.add("no")}
      $$(".opts button").forEach(x=>{if(it.opts[+x.dataset.j]===it.a)x.classList.add("ok");x.disabled=true});i++;setTimeout(step,r?750:1600)})};
  step()}
function recall(t,p,list){
  const items=list?shuffle(list.map(it=>({...it,opts:shuffle(it.opts)}))):pageQuiz(t,p);
  if(!items.length)return next(t,p);
  quiz(items,t,`Recall · page ${p+1}`,(ok,wrong)=>{
    render(`<p class="lbl">Recall · page ${p+1}</p><div class="score">${ok}/${items.length}</div>
      <p style="margin-top:18px">${wrong.length?`${wrong.length} wrong.`:"All correct."}</p>
      <div class="row">${wrong.length?`<button class="btn ghost" id="again">Repeat mistakes</button>`:""}<button class="btn" id="on">${p<t.pages.length-1?`On to page ${p+2} →`:"Back to the texts →"}</button></div>`,{text:t});
    $("#on").onclick=()=>next(t,p);const ag=$("#again");if(ag)ag.onclick=()=>recall(t,p,wrong)})}

/* ---------- saved: pages, sentences, words ---------- */
function saved(){
  const sents=marks.filter(m=>m.type==="s"),ws=marks.filter(m=>m.type==="w");
  const row=(m,g,e,open)=>`<div class="it">${open?`<button class="g" data-open="${marks.indexOf(m)}">${g} →</button>`:`<span class="g">${g}</span>`}<span class="e">${e}</span><button class="lbl" data-rm="${marks.indexOf(m)}">Remove</button></div>`;
  render(`<p class="lbl">Saved</p><h1>Saved</h1><h2>${marks.length?`${sents.length} sentences · ${ws.length} words`:"Nothing saved yet. Hold a word to mark it, or double-tap a sentence and choose “Save sentence”."}</h2>
  ${sents.length+ws.length?`<button class="btn" id="all">Review sentences and words →</button>`:""}
  ${sents.length?`<p class="lbl grp">Sentences</p>`+sents.map(m=>{const it=itemFor(m);return row(m,esc(it.q),esc(it.a))}).join(""):""}
  ${ws.length?`<p class="lbl grp">Words</p>`+ws.map(m=>{const it=itemFor(m);return row(m,`<i class="cd" style="--c:${m.c||"#000"}"></i>`+esc(it.q),esc(it.a))}).join(""):""}`);
  $$("[data-rm]").forEach(b=>b.onclick=()=>{marks.splice(+b.dataset.rm,1);save();saved()});
  $$("[data-open]").forEach(b=>b.onclick=()=>{const m=marks[+b.dataset.open];read(TEXTS.find(x=>x.id===m.t),m.p)});
  const a=$("#all");if(a)a.onclick=()=>{const items=shuffle(marks.filter(m=>m.type!=="p")).slice(0,15).map(fromMark);
    quiz(items,null,"Review",ok=>{render(`<p class="lbl">Review · result</p><div class="score">${ok}/${items.length}</div><div class="row"><button class="btn" id="b">Back to Saved →</button></div>`);$("#b").onclick=saved})}}

   <p class="lbl" style="margin-top:40px">Sources</p><p class="hint" style="margin-top:6px">Greek texts: Plato, Apology, ed. Burnet, digital text by the Perseus Digital Library (CC BY-SA 4.0); Heraclitus, Diels–Kranz, via Greek Wikisource (CC BY-SA); Epicurus, Letter to Menoeceus, in Diogenes Laertius X 122–135, ed. Hicks, digital text by the Perseus Digital Library (CC BY-SA 4.0). English translations and word glosses: written for this app. Portraits from Wikimedia Commons: Plato and Epicurus public domain; Heraclitus bust photo by Yair Haklai, CC BY-SA 4.0, background removed and converted to grayscale.</p>`);
